# TXO 賣方保證金 A/B/C 值 — 期交所不定期公告調整，一律走 config 不寫死
#
# 現值查證：2026-07-30，期交所「保證金一覽表」官網頁面（臺指選擇權風險保證金
# A/B/C 值三列）。期交所公告調整時要回來更新數字並同步 verified_date。
#
# 檔位意義：開倉收「原始」(initial)；持倉每日盯「維持」(maintenance)，
# 權益低於維持檔即追繳補回原始檔；「結算」(clearing) 為結算會員層級。
# 回測/paper trade：開倉用 initial、盯倉用 maintenance。

[txo]
verified_date = "2026-07-30"
source = "https://www.taifex.com.tw/cht/5/indexMarging"

# 三檔：結算保證金 < 維持保證金 < 原始保證金
[txo.a_value]
clearing = 125000
maintenance = 130000
initial = 169000

[txo.b_value]
clearing = 63000
maintenance = 65000
initial = 85000

[txo.c_value]
clearing = 12600
maintenance = 13000
initial = 17000
